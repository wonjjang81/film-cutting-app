name: Build APK & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: EAS Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 🚀 [순서 핵심] pnpm 환경 선제 구성
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 2. 🎯 Node.js 환경 구성 및 pnpm 캐시 적용
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Build APK via EAS
        id: build
        run: |
          echo "EAS 빌드 시작..."
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            2>&1 | tee /tmp/eas-build-output.txt
          echo "EAS 빌드 완료"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Extract APK URL and Download
        id: download
        run: |
          echo "=== EAS 빌드 출력 ==="
          cat /tmp/eas-build-output.txt

          # 최근 완료된 빌드 URL 조회
          APK_URL=$(eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json \
            2>/dev/null | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              if isinstance(data, list) and data:
                  url = data[0].get('artifacts', {}).get('buildUrl', '')
                  print(url)
          except Exception as e:
              import sys
              print(f'파싱 오류: {e}', file=sys.stderr)
          " 2>/dev/null || echo "")

          echo "APK URL: $APK_URL"

          if [ -z "$APK_URL" ]; then
            # 출력에서 직접 URL 추출 시도
            APK_URL=$(grep -oE 'https://expo\.dev/artifacts/eas/[^[:space:]]+\.apk' /tmp/eas-build-output.txt | head -1 || echo "")
            echo "출력에서 추출한 URL: $APK_URL"
          fi

          if [ -n "$APK_URL" ]; then
            curl -L -o film-cutting-app.apk "$APK_URL"
            ls -lh film-cutting-app.apk
            echo "apk_ready=true" >> $GITHUB_OUTPUT
          else
            echo "APK URL을 찾지 못했습니다."
            echo "apk_ready=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          name: "필름 재단 계산기 v${{ steps.version.outputs.version }} (빌드 #${{ github.run_number }})"
          body: |
            ## 📱 필름 재단 계산기 APK 다운로드

            **버전**: v${{ steps.version.outputs.version }}
            **빌드**: #${{ github.run_number }}
            **커밋**: ${{ github.sha }}

            ### 설치 방법
            1. 아래 `film-cutting-app.apk` 파일을 다운로드
            2. Android 기기에서 파일 열기
            3. "알 수 없는 출처" 설치 허용 후 설치

            > ⚠️ 설치 전 기기 설정 → 보안 → "알 수 없는 앱 설치" 허용 필요
          files: film-cutting-app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
