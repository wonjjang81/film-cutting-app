name: Build APK & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: EAS Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Build APK via EAS
        id: build
        run: |
          # EAS 빌드 시작 후 빌드 ID 추출
          BUILD_JSON=$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --json \
            2>&1)
          echo "EAS output: $BUILD_JSON"

          # buildId 추출
          BUILD_ID=$(echo "$BUILD_JSON" | python3 -c "
          import sys, json, re
          text = sys.stdin.read()
          # JSON 배열 파싱 시도
          try:
              arr = json.loads(text)
              if isinstance(arr, list) and arr:
                  print(arr[0].get('id', ''))
                  sys.exit(0)
          except:
              pass
          # id 패턴 직접 검색
          m = re.search(r'\"id\":\s*\"([a-f0-9-]{36})\"', text)
          if m:
              print(m.group(1))
          " 2>/dev/null || echo "")

          echo "Build ID: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

          # 빌드 완료 대기 (최대 30분)
          if [ -n "$BUILD_ID" ]; then
            echo "빌드 완료 대기 중..."
            for i in $(seq 1 60); do
              sleep 30
              STATUS=$(eas build:view "$BUILD_ID" --json 2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('status', 'UNKNOWN'))
          except:
              print('UNKNOWN')
          " 2>/dev/null || echo "UNKNOWN")
              echo "[$i/60] 빌드 상태: $STATUS"
              if [ "$STATUS" = "FINISHED" ]; then
                break
              elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
                echo "빌드 실패: $STATUS"
                exit 1
              fi
            done

            # APK URL 추출
            APK_URL=$(eas build:view "$BUILD_ID" --json 2>/dev/null | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              url = d.get('artifacts', {}).get('buildUrl', '')
              print(url)
          except:
              pass
          " 2>/dev/null || echo "")
            echo "APK URL: $APK_URL"
            echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        run: |
          APK_URL="${{ steps.build.outputs.apk_url }}"
          if [ -z "$APK_URL" ]; then
            echo "APK URL을 찾지 못했습니다."
            exit 1
          fi
          echo "APK 다운로드: $APK_URL"
          curl -L -o film-cutting-app.apk "$APK_URL"
          ls -lh film-cutting-app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build${{ github.run_number }}
          name: "필름 재단 계산기 v${{ steps.version.outputs.version }} (빌드 #${{ github.run_number }})"
          body: |
            ## 📱 필름 재단 계산기 APK 다운로드

            **버전**: v${{ steps.version.outputs.version }}
            **빌드**: #${{ github.run_number }}
            **커밋**: ${{ github.sha }}

            ### 설치 방법
            1. 아래 `film-cutting-app.apk` 파일을 다운로드
            2. Android 기기에서 파일 열기
            3. "알 수 없는 출처" 설치 허용 후 설치

            > ⚠️ 설치 전 기기 설정 → 보안 → "알 수 없는 앱 설치" 허용 필요
          files: film-cutting-app.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
