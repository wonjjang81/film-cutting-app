name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy-web:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. ✨ [순서 변경] Node.js 환경을 먼저 구성하여 Node 20 경고 방어
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 2. 🚀 [수정] version 속성을 제거하여 package.json의 pnpm 버전을 따르도록 설정
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. pnpm 캐시 설정을 위한 Node.js 재설정 (선택 사항이지만 안정적임)
      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web
        run: npx expo export --platform web --output-dir dist

      - name: Prepare Deployment
        run: |
          cd dist
          touch .nojekyll
          
          # GitHub Pages SPA 404 리다이렉트 트릭
          cat > 404.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Film Cutting App</title>
              <script type="text/javascript">
                var pathSegmentsToKeep = 1;
                var l = window.location;
                l.replace(
                  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                  l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                  l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                  l.hash
                );
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        run: |
          cd dist
          git init
          git checkout -b gh-pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Deploy: ${{ github.sha }}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
