name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy-web:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 🚀 [순서 핵심] pnpm을 시스템에 최우선으로 설치 (버전 선언 제외하여 충돌 예방)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 2. 🎯 Node.js 환경 빌드 및 pnpm 의존성 캐시 연결
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm' # pnpm이 먼저 설치되어 있어야 정상 작동합니다.

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web
        run: npx expo export --platform web --output-dir dist

      - name: Prepare Deployment
        run: |
          cd dist
          touch .nojekyll
          
          # GitHub Pages SPA 404 리다이렉트 트릭
          cat > 404.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Film Cutting App</title>
              <script type="text/javascript">
                var pathSegmentsToKeep = 1;
                var l = window.location;
                l.replace(
                  l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                  l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                  l.pathname.split('/').slice(1 + pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                  (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                  l.hash
                );
              </script>
            </head>
            <body></body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        run: |
          cd dist
          git init
          git checkout -b gh-pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Deploy: ${{ github.sha }}"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
